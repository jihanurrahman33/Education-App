name: education_app
description: "EduFlow - Modern Clean Architecture Education Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Architecture & State Management
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  equatable: ^2.0.5

  # Networking & Navigation
  dio: ^5.7.0
  go_router: ^14.8.1

  # Local Storage & Utilities
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # UI, Icons & Splash
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"

flutter_native_splash:
  color: "#121414"
  image: "assets/icon.png"
  android: true
  ios: true
  web: true
  android_12:
    image: "assets/icon.png"
    color: "#121414"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/ss/
    - assets/stitch_screens/

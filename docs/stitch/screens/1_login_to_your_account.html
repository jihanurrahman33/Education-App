<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduFlow - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "outline-variant": "#c3c5d7",
                        "primary": "#003fb1",
                        "on-surface-variant": "#434654",
                        "surface-container-low": "#f0f3ff",
                        "on-background": "#151c27",
                        "on-surface": "#151c27",
                        "on-primary-fixed": "#00174d",
                        "primary-fixed-dim": "#b5c4ff",
                        "inverse-on-surface": "#ebf1ff",
                        "on-secondary-fixed": "#002114",
                        "secondary": "#006c4a",
                        "surface": "#f9f9ff",
                        "tertiary": "#694100",
                        "on-secondary-fixed-variant": "#005137",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-tertiary-fixed": "#2a1700",
                        "on-primary-container": "#d4dcff",
                        "outline": "#737686",
                        "inverse-primary": "#b5c4ff",
                        "tertiary-fixed": "#ffddb8",
                        "secondary-container": "#82f5c1",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "background": "#f9f9ff",
                        "surface-container-high": "#e2e8f8",
                        "primary-container": "#1a56db",
                        "on-primary": "#ffffff",
                        "surface-container": "#e7eefe",
                        "tertiary-fixed-dim": "#ffb95f",
                        "secondary-fixed-dim": "#68dba9",
                        "secondary-fixed": "#85f8c4",
                        "on-tertiary-container": "#ffd6a8",
                        "on-primary-fixed-variant": "#003dab",
                        "surface-container-highest": "#dce2f3",
                        "on-secondary-container": "#00714e",
                        "surface-tint": "#1353d8",
                        "inverse-surface": "#2a313d",
                        "surface-bright": "#f9f9ff",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "surface-variant": "#dce2f3",
                        "surface-dim": "#d3daea",
                        "tertiary-container": "#895600"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "32px",
                        "unit": "8px",
                        "gutter": "24px",
                        "container-padding-mobile": "16px",
                        "stack-md": "16px",
                        "container-padding-desktop": "32px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop bg-surface-container-lowest relative overflow-hidden">
<!-- Subtle Background Elements for depth -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="w-full max-w-md relative z-10">
<!-- Logo / Brand Header -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-container text-on-primary-container mb-stack-md shadow-sm">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">EduFlow</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-stack-sm">Welcome back to your learning journey</p>
</div>
<!-- Login Form Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.06)] border border-outline-variant/30 p-gutter">
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="email">Email address or Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input autocomplete="email" class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface-container-lowest placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-unit">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface-container-lowest placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Submit -->
<div class="flex items-center mb-stack-md">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded transition-colors bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember me
                    </label>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-[0.98] transition-all" type="submit">
                    Sign in to Account
                </button>
</form>
<!-- Divider -->
<div class="mt-stack-lg mb-stack-lg relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/40"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-outline font-label-sm text-label-sm uppercase tracking-wider">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-stack-sm">
<button class="w-full flex items-center justify-center px-4 py-2 border border-outline-variant rounded-lg shadow-sm bg-surface-container-lowest hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary" type="button">
<svg class="h-5 w-5 mr-2" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="w-full flex items-center justify-center px-4 py-2 border border-outline-variant rounded-lg shadow-sm bg-surface-container-lowest hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary" type="button">
<svg class="h-5 w-5 mr-2" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16.365 7.143c.928-1.127 1.554-2.73 1.385-4.324-1.366.056-3.082.91-4.04 2.05-0.84 0.992-1.584 2.628-1.386 4.195 1.53.118 3.116-.795 4.04-1.921zm-1.875 1.31c-2.485 0-4.022 1.488-5.748 1.488-1.748 0-3.32-1.436-5.46-1.436-2.825 0-5.438 1.636-6.865 4.124-2.88 5-0.738 12.39 2.062 16.42 1.366 1.968 2.97 4.135 5.116 4.053 2.065-.082 2.84-1.332 5.334-1.332 2.476 0 3.18 1.332 5.352 1.28 2.22-.05 3.636-2.022 4.97-3.972 1.537-2.247 2.172-4.425 2.202-4.538-.046-.02-4.24-1.63-4.283-6.49-.036-4.084 3.328-6.046 3.475-6.14-1.92-2.806-4.9-3.186-5.962-3.26-2.583-.245-5.074 1.524-5.69 1.524z" transform="scale(0.85) translate(2, 2)"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Registration Link -->
<div class="mt-stack-lg text-center bg-surface-container-lowest p-unit rounded-lg border border-outline-variant/30">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to EduFlow? 
            </p>
<div class="mt-2 flex flex-col sm:flex-row justify-center gap-2 items-center">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-variant transition-colors underline-offset-4 hover:underline" href="#">Register as a Student</a>
<span class="hidden sm:inline text-outline-variant px-1">•</span>
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors underline-offset-4 hover:underline" href="#">Register as a Teacher</a>
</div>
</div>
</div>
</body></html>
